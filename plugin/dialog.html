<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Zotero</title>
	<script src="../v1/plugins.js"></script>
	<style>
		html, body { margin: 0; }
		body { font: 13px/18px -apple-system, "Segoe UI", Roboto, "Open Sans", sans-serif; padding: 14px 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
	</style>
</head>
<body>
	<div id="text"></div>
	<script>
		document.getElementById('text').textContent = decodeURIComponent(location.hash.slice(1));
		window.Asc.plugin.init = function () {};
		window.Asc.plugin.onThemeChanged = function (theme) { window.Asc.plugin.onThemeChangedBase(theme); };
	</script>
</body>
</html>
